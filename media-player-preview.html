(()=>{'use strict';
const canvas=document.getElementById('originalSphere'),image=document.getElementById('playerOriginal'),context=canvas.getContext('2d');if(!context)return;
const size=560,center=size/2,radius=260,textureSize=337,textureCenter=168,textureRadius=167.5;
const sampling=document.createElement('canvas');sampling.width=sampling.height=textureSize;const sampleContext=sampling.getContext('2d',{willReadFrequently:true});
const frame=context.createImageData(size,size),out=frame.data,pixels=[];let texture,angle=0,previous=0,lastPaint=0;

 for(let y=0;y<size;y++)for(let x=0;x<size;x++){const nx=(x+.5-center)/radius,ny=(y+.5-center)/radius,d=nx*nx+ny*ny;if(d>1)continue;const sourceY=Math.max(0,Math.min(textureSize-1,Math.round(textureCenter+ny*textureRadius)));const alpha=Math.min(1,Math.max(0,(1-Math.sqrt(d))*radius));pixels.push({index:(y*size+x)*4,nx,nz:Math.sqrt(1-d),row:sourceY*textureSize*4,alpha:Math.round(alpha*255)})}

function tick(now){requestAnimationFrame(tick);if(!previous)previous=now;const dt=Math.min((now-previous)/1000,.08);previous=now;if(document.hidden)return;angle=(angle+dt*.14)%(Math.PI*2);if(now-lastPaint<33)return;paint();lastPaint=now}
